<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-labelledby="title description">
<title id="title">From URL to web page: DNS and HTTPS infrastructure</title>
<desc id="description">Illustrative architecture, not Google's internal infrastructure. DNS queries and answers use a separate dashed purple path. The browser uses the resolved IP and TCP port 443. Website TLS passes through the network firewall and ends at the load balancer. Separate TLS connections protect the load balancer to web server, web server to application server, and application server to database paths. Response arrows return to the browser. Database access is optional for static or cached requests.</desc>
<defs>
  <style>text { font-family: 'Segoe UI', Arial, sans-serif; } .label { font-weight: 600; } </style>

<marker id="arrow-dns" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7652AE"/></marker>
<marker id="arrow-tls" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#137C78"/></marker>
<marker id="arrow-internal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2868B2"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1760" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<rect x="0" y="0" width="1600" height="245" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1.5"/>
<text x="64" y="53" font-size="20" fill="#4B6478" font-weight="650" text-anchor="start">HOLBERTON  /  NETWORK FUNDAMENTALS</text>
<text x="64" y="119" font-size="51" fill="#142D42" font-weight="700" text-anchor="start">From URL to web page</text>
<text x="64" y="162" font-size="26" fill="#4B6478" font-weight="400" text-anchor="start">https://www.google.com  ·  A fresh HTTPS connection over TCP</text>
<rect x="64" y="188" width="1472" height="43" rx="10" fill="#E7EEF4" stroke="none" stroke-width="1.5"/>
<text x="84" y="217" font-size="23" fill="#142D42" font-weight="600" text-anchor="start">ILLUSTRATIVE ARCHITECTURE — not a map of Google&#x27;s internal infrastructure</text>
<g id="dns-resolution">
<rect x="48" y="277" width="1504" height="332" rx="20" fill="#F6F2FB" stroke="none" stroke-width="1.5"/>
<rect x="64" y="288" width="48" height="40" rx="10" fill="#7652AE" stroke="none" stroke-width="1.5"/>
<text x="88" y="317" font-size="23" fill="white" font-weight="700" text-anchor="middle">01</text>
<text x="132" y="317" font-size="30" fill="#142D42" font-weight="650" text-anchor="start">Resolve the hostname</text>
<text x="1530" y="316" font-size="21" fill="#7652AE" font-weight="600" text-anchor="end">DNS traffic = dashed purple arrows</text>
<g id="dns-client" data-card="true">
<rect x="64" y="346" width="320" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="84" y="369" width="5" height="30" rx="2" fill="#7652AE" stroke="none" stroke-width="1.5"/>
<text x="104" y="389" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Browser + OS</text>
<text x="104" y="424" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">www.google.com</text>
<text x="104" y="456" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Checks local caches</text>
</g>
<g id="recursive-resolver" data-card="true">
<rect x="610" y="346" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="630" y="369" width="5" height="30" rx="2" fill="#7652AE" stroke="none" stroke-width="1.5"/>
<text x="650" y="389" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Recursive resolver</text>
<text x="650" y="424" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Checks its cache</text>
<text x="650" y="456" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Resolves on a miss</text>
</g>
<g id="dns-hierarchy" data-card="true">
<rect x="1150" y="346" width="386" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="1170" y="369" width="5" height="30" rx="2" fill="#7652AE" stroke="none" stroke-width="1.5"/>
<text x="1190" y="389" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">DNS hierarchy</text>
<text x="1190" y="424" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Root → .com →</text>
<text x="1190" y="456" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Authoritative DNS</text>
</g>
<path d="M384,402 L605,402" fill="none" stroke="#7652AE" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-dns)"/>
<text x="497.0" y="382" font-size="21" fill="#7652AE" font-weight="600" text-anchor="middle">A / AAAA query</text>
<path d="M610,469 L389,469" fill="none" stroke="#7652AE" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-dns)"/>
<text x="497.0" y="497" font-size="21" fill="#7652AE" font-weight="600" text-anchor="middle">IP address + TTL</text>
<path d="M940,402 L1145,402" fill="none" stroke="#7652AE" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-dns)"/>
<text x="1045.0" y="382" font-size="21" fill="#7652AE" font-weight="600" text-anchor="middle">DNS queries</text>
<path d="M1150,469 L945,469" fill="none" stroke="#7652AE" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-dns)"/>
<text x="1045.0" y="497" font-size="21" fill="#7652AE" font-weight="600" text-anchor="middle">Referrals / answers</text>
<text x="64" y="553" font-size="23" fill="#4B6478" font-weight="400" text-anchor="start">Classic DNS shown: UDP/TCP 53. Cache hits may skip upstream lookups.</text>
<text x="64" y="586" font-size="23" fill="#4B6478" font-weight="400" text-anchor="start">Separate from website HTTPS; DNS-over-HTTPS and DNS-over-TLS are not depicted.</text>
</g>
<g id="https-connection">
<rect x="64" y="630" width="48" height="40" rx="10" fill="#137C78" stroke="none" stroke-width="1.5"/>
<text x="88" y="659" font-size="23" fill="white" font-weight="700" text-anchor="middle">02</text>
<text x="132" y="659" font-size="30" fill="#142D42" font-weight="650" text-anchor="start">Connect securely and send the request</text>
<rect x="64" y="682" width="1472" height="73" rx="12" fill="#F0F4F7" stroke="none" stroke-width="1.5"/>
<text x="84" y="711" font-size="25" fill="#142D42" font-weight="600" text-anchor="start">Destination: resolved IP address  ·  HTTPS destination port: TCP 443</text>
<text x="84" y="741" font-size="23" fill="#4B6478" font-weight="400" text-anchor="start">TCP handshake → TLS handshake + certificate validation → encrypted HTTP over TCP/IP</text>
<rect x="48" y="779" width="1504" height="269" rx="20" fill="#EDF8F6" stroke="#AED8D2" stroke-width="1.5"/>
<text x="72" y="817" font-size="24" fill="#137C78" font-weight="650" text-anchor="start">TLS A  ·  Browser ↔ load balancer</text>
<text x="1528" y="817" font-size="23" fill="#137C78" font-weight="600" text-anchor="end">HTTP data is encrypted on the wire</text>
<g id="https-browser" data-card="true">
<rect x="64" y="838" width="320" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="84" y="861" width="5" height="30" rx="2" fill="#137C78" stroke="none" stroke-width="1.5"/>
<text x="104" y="881" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Browser</text>
<text x="104" y="916" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">GET /</text>
<text x="104" y="948" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Renders the response</text>
</g>
<g id="firewall" data-card="true">
<rect x="610" y="838" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="630" y="861" width="5" height="30" rx="2" fill="#137C78" stroke="none" stroke-width="1.5"/>
<text x="650" y="881" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Network firewall</text>
<text x="650" y="916" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Allows TCP 443</text>
<text x="650" y="948" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Filters every stage</text>
<text x="650" y="980" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Does not decrypt HTTP</text>
</g>
<g id="load-balancer" data-card="true">
<rect x="1150" y="838" width="386" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="1170" y="861" width="5" height="30" rx="2" fill="#137C78" stroke="none" stroke-width="1.5"/>
<text x="1190" y="881" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Load balancer</text>
<text x="1190" y="916" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Terminates TLS A</text>
<text x="1190" y="948" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Selects a backend</text>
<text x="1190" y="980" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Starts separate TLS B</text>
</g>
<path d="M384,893 L605,893" fill="none" stroke="#137C78" stroke-width="3" marker-end="url(#arrow-tls)"/>
<text x="497.0" y="873" font-size="22" fill="#137C78" font-weight="600" text-anchor="middle">HTTPS request</text>
<path d="M610,961 L389,961" fill="none" stroke="#137C78" stroke-width="3" marker-end="url(#arrow-tls)"/>
<text x="497.0" y="991" font-size="22" fill="#137C78" font-weight="600" text-anchor="middle">HTTP response</text>
<path d="M940,893 L1145,893" fill="none" stroke="#137C78" stroke-width="3" marker-end="url(#arrow-tls)"/>
<text x="1045.0" y="873" font-size="22" fill="#137C78" font-weight="600" text-anchor="middle">HTTPS request</text>
<path d="M1150,961 L945,961" fill="none" stroke="#137C78" stroke-width="3" marker-end="url(#arrow-tls)"/>
<text x="1045.0" y="991" font-size="22" fill="#137C78" font-weight="600" text-anchor="middle">HTTP response</text>
<text x="800" y="1033" font-size="22" fill="#137C78" font-weight="400" text-anchor="middle">The firewall filters connection setup and return traffic; it is not a TLS endpoint.</text>
</g>
<g id="backend-processing">
<rect x="64" y="1091" width="48" height="40" rx="10" fill="#2868B2" stroke="none" stroke-width="1.5"/>
<text x="88" y="1120" font-size="23" fill="white" font-weight="700" text-anchor="middle">03</text>
<text x="132" y="1120" font-size="30" fill="#142D42" font-weight="650" text-anchor="start">Process the request and return the response</text>
<rect x="48" y="1165" width="1504" height="262" rx="20" fill="#F0F5FC" stroke="#BCD0EB" stroke-width="1.5"/>
<text x="72" y="1196" font-size="23" fill="#2868B2" font-weight="600" text-anchor="start">Separate protected backend connections in this example</text>
<g id="database" data-card="true">
<rect x="64" y="1216" width="320" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="84" y="1239" width="5" height="30" rx="2" fill="#2868B2" stroke="none" stroke-width="1.5"/>
<text x="104" y="1259" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Database</text>
<text x="104" y="1294" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Persistent data</text>
<text x="104" y="1326" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Optional request path</text>
<text x="104" y="1358" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">No browser access</text>
</g>
<g id="application-server" data-card="true">
<rect x="610" y="1216" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="630" y="1239" width="5" height="30" rx="2" fill="#2868B2" stroke="none" stroke-width="1.5"/>
<text x="650" y="1259" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Application server</text>
<text x="650" y="1294" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Runs business logic</text>
<text x="650" y="1326" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Creates the response</text>
<text x="650" y="1358" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Calls data if needed</text>
</g>
<g id="web-server" data-card="true">
<rect x="1150" y="1216" width="386" height="165" rx="16" fill="#FFFFFF" stroke="#CFDCE5" stroke-width="1.5"/>
<rect x="1170" y="1239" width="5" height="30" rx="2" fill="#2868B2" stroke="none" stroke-width="1.5"/>
<text x="1190" y="1259" font-size="27" fill="#142D42" font-weight="650" text-anchor="start">Web server</text>
<text x="1190" y="1294" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Serves static content</text>
<text x="1190" y="1326" font-size="22" fill="#4B6478" font-weight="400" text-anchor="start">Proxies dynamic requests</text>
</g>
<path d="M1255,1003 L1255,1211" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<path d="M1480,1216 L1480,1008" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<rect x="1271" y="1065" width="193" height="80" rx="8" fill="white" stroke="none" stroke-width="1.5"/>
<text x="1368" y="1096" font-size="23" fill="#2868B2" font-weight="600" text-anchor="middle">HTTPS / TLS B</text>
<text x="1368" y="1128" font-size="21" fill="#2868B2" font-weight="400" text-anchor="middle">New TLS session</text>
<path d="M610,1270 L389,1270" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<text x="497.0" y="1250" font-size="21" fill="#2868B2" font-weight="600" text-anchor="middle">DB query / TLS D</text>
<path d="M384,1341 L605,1341" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<text x="497.0" y="1370" font-size="21" fill="#2868B2" font-weight="600" text-anchor="middle">Query result</text>
<path d="M1150,1270 L945,1270" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<text x="1045.0" y="1250" font-size="21" fill="#2868B2" font-weight="600" text-anchor="middle">HTTPS / TLS C</text>
<path d="M940,1341 L1145,1341" fill="none" stroke="#2868B2" stroke-width="3" marker-end="url(#arrow-internal)"/>
<text x="1045.0" y="1370" font-size="21" fill="#2868B2" font-weight="600" text-anchor="middle">HTTP response</text>
<text x="800" y="1411" font-size="22" fill="#2868B2" font-weight="400" text-anchor="middle">Arrows show requests and replies. Static or cached responses may skip application/database work.</text>
</g>
<g id="encryption-and-scope-notes">
<rect x="64" y="1464" width="716" height="183" rx="16" fill="#F6F8FA" stroke="none" stroke-width="1.5"/>
<rect x="804" y="1464" width="732" height="183" rx="16" fill="#F6F8FA" stroke="none" stroke-width="1.5"/>
<text x="88" y="1505" font-size="23" fill="#142D42" font-weight="700" text-anchor="start">ENCRYPTION BOUNDARIES</text>
<text x="88" y="1547" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">TLS A ends at the load balancer.</text>
<text x="88" y="1580" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">TLS B, C and D are independent sessions.</text>
<text x="88" y="1613" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">Each endpoint reads its decrypted payload.</text>
<text x="828" y="1505" font-size="23" fill="#142D42" font-weight="700" text-anchor="start">SCOPE OF THIS ILLUSTRATION</text>
<text x="828" y="1547" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">HTTP/1.1 or HTTP/2 over TCP is shown.</text>
<text x="828" y="1580" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">HTTP/3 uses QUIC over UDP instead.</text>
<text x="828" y="1613" font-size="24" fill="#4B6478" font-weight="400" text-anchor="start">Backend roles and encryption are illustrative.</text>
</g>
<path d="M64,1691 L1536,1691" fill="none" stroke="#DCE5EC" stroke-width="1"/>
<text x="64" y="1730" font-size="24" fill="#142D42" font-weight="600" text-anchor="start">HTTP response → browser parses HTML, builds the DOM and renders the page.</text>
<text x="1536" y="1730" font-size="20" fill="#4B6478" font-weight="600" text-anchor="end">HBTN-NET-001</text>
</svg>
